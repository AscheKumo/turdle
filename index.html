<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turdle 🐢</title>
  <style>
    :root {
      --bg: #121213;
      --text: #d7dadc;
      --tile-empty: #3a3a3c;
      --correct: #538d4e;
      --present: #b59f3b;
      --absent: #3a3a3c;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 1em;
      font-size: 2em;
    }
    #game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5em;
      margin: 2em 0;
    }
    .guess-row {
      display: flex;
      gap: 0.25em;
    }
    .letter-box {
      width: 3em;
      height: 3em;
      border: 2px solid var(--tile-empty);
      font-size: 1.5em;
      font-weight: bold;
      line-height: 3em;
      text-transform: uppercase;
      background-color: var(--bg);
      color: var(--text);
    }
    .correct {
      background-color: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }
    .present {
      background-color: var(--present);
      border-color: var(--present);
      color: #fff;
    }
    .absent {
      background-color: var(--absent);
      border-color: var(--absent);
      color: #fff;
    }
    input[type="text"] {
      font-size: 1.2em;
      padding: 0.5em;
      width: 300px;
      margin-top: 1em;
      background: #222;
      color: #fff;
      border: 1px solid #555;
    }
    button {
      padding: 0.5em 1em;
      font-size: 1em;
      margin-left: 1em;
      background-color: #538d4e;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    #keyboard {
      margin: 2em auto;
      max-width: 500px;
    }
    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.25em;
      margin-bottom: 0.5em;
    }
    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #818384;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 0.9em;
      cursor: pointer;
      border-radius: 4px;
      user-select: none;
      min-width: 2.5em;
      height: 3.5em;
    }
    .key.wide {
      min-width: 4em;
    }
    .key:hover {
      opacity: 0.8;
    }
    .key.correct {
      background-color: var(--correct);
    }
    .key.present {
      background-color: var(--present);
    }
    .key.absent {
      background-color: #3a3a3c;
    }
    #share-container {
      margin: 1em;
    }
    #share-button {
      background-color: #538d4e;
      border: none;
      color: white;
      padding: 0.5em 1em;
      font-size: 1em;
      cursor: pointer;
      border-radius: 4px;
      display: none;
    }
    .current-letter {
      border-color: #565758;
      background-color: #121213;
      color: #d7dadc;
    }
  </style>
</head>
<body>
  <header>Turdle 🐢</header>
  <div id="game"></div>
  <div id="keyboard">
    <div class="keyboard-row">
      <button class="key" data-key="Q">Q</button>
      <button class="key" data-key="W">W</button>
      <button class="key" data-key="E">E</button>
      <button class="key" data-key="R">R</button>
      <button class="key" data-key="T">T</button>
      <button class="key" data-key="Y">Y</button>
      <button class="key" data-key="U">U</button>
      <button class="key" data-key="I">I</button>
      <button class="key" data-key="O">O</button>
      <button class="key" data-key="P">P</button>
    </div>
    <div class="keyboard-row">
      <button class="key" data-key="A">A</button>
      <button class="key" data-key="S">S</button>
      <button class="key" data-key="D">D</button>
      <button class="key" data-key="F">F</button>
      <button class="key" data-key="G">G</button>
      <button class="key" data-key="H">H</button>
      <button class="key" data-key="J">J</button>
      <button class="key" data-key="K">K</button>
      <button class="key" data-key="L">L</button>
    </div>
    <div class="keyboard-row">
      <button class="key wide" data-key="ENTER">ENTER</button>
      <button class="key" data-key="Z">Z</button>
      <button class="key" data-key="X">X</button>
      <button class="key" data-key="C">C</button>
      <button class="key" data-key="V">V</button>
      <button class="key" data-key="B">B</button>
      <button class="key" data-key="N">N</button>
      <button class="key" data-key="M">M</button>
      <button class="key wide" data-key="BACKSPACE">⌫</button>
    </div>
  </div>
  <div id="share-container">
    <button id="share-button" onclick="shareResults()">Share Results</button>
  </div>

  <script>
    const answers = [
  "ABOUT", "ABOVE", "ABUSE", "ACTOR", "ACUTE", "ADMIT", "ADOPT", "ADULT", "AFTER", "AGAIN",
  "AGENT", "AGREE", "AHEAD", "ALARM", "ALBUM", "ALERT", "ALIEN", "ALIGN", "ALIKE", "ALIVE",
  "ALLOW", "ALONE", "ALONG", "ALTER", "AMONG", "ANGER", "ANGLE", "ANGRY", "APART", "APPLE",
  "APPLY", "ARENA", "ARGUE", "ARISE", "ARRAY", "ASIDE", "ASSET", "AUDIO", "AUDIT", "AVOID",
  "AWAKE", "AWARD", "AWARE", "BADLY", "BAKER", "BASES", "BASIC", "BEACH", "BEGAN", "BEGIN",
  "BEING", "BELOW", "BENCH", "BILLY", "BIRTH", "BLACK", "BLAME", "BLANK", "BLAST", "BLIND",
  "BLOCK", "BLOOD", "BOARD", "BOAST", "BOBBY", "BONUS", "BOOST", "BOOTH", "BOUND", "BRAIN",
  "BRAND", "BRASS", "BRAVE", "BREAD", "BREAK", "BREED", "BRIEF", "BRING", "BROAD", "BROKE",
  "BROWN", "BUILD", "BUILT", "BUYER", "CABLE", "CALIF", "CARRY", "CATCH", "CAUSE", "CHAIN",
  "CHAIR", "CHAOS", "CHARM", "CHART", "CHASE", "CHEAP", "CHECK", "CHEST", "CHIEF", "CHILD",
  "CHINA", "CHOSE", "CIVIL", "CLAIM", "CLASS", "CLEAN", "CLEAR", "CLICK", "CLIMB", "CLOCK",
  "CLOSE", "CLOUD", "COACH", "COAST", "COULD", "COUNT", "COURT", "COVER", "CRAFT", "CRASH",
  "CRAZY", "CREAM", "CRIME", "CROSS", "CROWD", "CROWN", "CRUDE", "CURVE", "CYCLE", "DAILY",
  "DANCE", "DATED", "DEALT", "DEATH", "DEBUT", "DELAY", "DEPTH", "DOING", "DOUBT", "DOZEN",
  "DRAFT", "DRAMA", "DRANK", "DRAWN", "DREAM", "DRESS", "DRILL", "DRINK", "DRIVE", "DROVE",
  "DYING", "EAGER", "EARLY", "EARTH", "EIGHT", "ELITE", "EMPTY", "ENEMY", "ENJOY", "ENTER",
  "ENTRY", "EQUAL", "ERROR", "EVENT", "EVERY", "EXACT", "EXIST", "EXTRA", "FAITH", "FALSE",
  "FAULT", "FIBER", "FIELD", "FIFTH", "FIFTY", "FIGHT", "FINAL", "FIRST", "FIXED", "FLASH",
  "FLEET", "FLOOR", "FLUID", "FOCUS", "FORCE", "FORTH", "FORTY", "FORUM", "FOUND", "FRAME",
  "FRANK", "FRAUD", "FRESH", "FRONT", "FRUIT", "FULLY", "FUNNY", "GIANT", "GIVEN", "GLASS",
  "GLOBE", "GOING", "GRACE", "GRADE", "GRAND", "GRANT", "GRASS", "GRAVE", "GREAT", "GREEN",
  "GROSS", "GROUP", "GROWN", "GUARD", "GUESS", "GUEST", "GUIDE", "HAPPY", "HARRY", "HEART",
  "HEAVY", "HENCE", "HENRY", "HORSE", "HOTEL", "HOUSE", "HUMAN", "IDEAL", "IMAGE", "INDEX",
  "INNER", "INPUT", "ISSUE", "JAPAN", "JIMMY", "JOINT", "JONES", "JUDGE", "KNOWN", "LABEL",
  "LARGE", "LASER", "LATER", "LAUGH", "LAYER", "LEARN", "LEASE", "LEAST", "LEAVE", "LEGAL",
  "LEVEL", "LEWIS", "LIGHT", "LIMIT", "LINKS", "LIVES", "LOCAL", "LOOSE", "LOWER", "LUCKY",
  "LUNCH", "LYING", "MAGIC", "MAJOR", "MAKER", "MARCH", "MARIA", "MATCH", "MAYBE", "MAYOR",
  "MEANT", "MEDIA", "METAL", "MIGHT", "MINOR", "MINUS", "MIXED", "MODEL", "MONEY", "MONTH",
  "MORAL", "MOTOR", "MOUNT", "MOUSE", "MOUTH", "MOVED", "MOVIE", "MUSIC", "NEEDS", "NEVER",
  "NEWLY", "NIGHT", "NOISE", "NORTH", "NOTED", "NOVEL", "NURSE", "OCCUR", "OCEAN", "OFFER",
  "OFTEN", "ORDER", "OTHER", "OUGHT", "PAINT", "PANEL", "PAPER", "PARTY", "PEACE", "PETER",
  "PHASE", "PHONE", "PHOTO", "PIANO", "PIECE", "PILOT", "PITCH", "PLACE", "PLAIN", "PLANE",
  "PLANT", "PLATE", "POINT", "POUND", "POWER", "PRESS", "PRICE", "PRIDE", "PRIME", "PRINT",
  "PRIOR", "PRIZE", "PROOF", "PROUD", "PROVE", "QUEEN", "QUICK", "QUIET", "QUITE", "RADIO",
  "RAISE", "RANGE", "RAPID", "RATIO", "REACH", "READY", "REALM", "REBEL", "REFER", "RELAX",
  "REPAY", "REPLY", "RIGHT", "RIVAL", "RIVER", "ROBIN", "ROGER", "ROMAN", "ROUGH", "ROUND",
  "ROUTE", "ROYAL", "RURAL", "SCALE", "SCENE", "SCOPE", "SCORE", "SENSE", "SERVE", "SEVEN",
  "SHALL", "SHAPE", "SHARE", "SHARP", "SHEET", "SHELF", "SHELL", "SHIFT", "SHIRT", "SHOCK",
  "SHOOT", "SHORT", "SHOWN", "SIGHT", "SILLY", "SINCE", "SIXTH", "SIXTY", "SIZED", "SKILL",
  "SLEEP", "SLIDE", "SMALL", "SMART", "SMILE", "SMITH", "SMOKE", "SNAP", "SOLID", "SOLVE",
  "SORRY", "SOUND", "SOUTH", "SPACE", "SPARE", "SPEAK", "SPEED", "SPEND", "SPENT", "SPLIT",
  "SPOKE", "SPORT", "STAFF", "STAGE", "STAKE", "STAND", "START", "STATE", "STEAM", "STEEL",
  "STICK", "STILL", "STOCK", "STONE", "STOOD", "STORE", "STORM", "STORY", "STRIP", "STUCK",
  "STUDY", "STUFF", "STYLE", "SUGAR", "SUITE", "SUPER", "SWEET", "TABLE", "TAKEN", "TASTE",
  "TAXES", "TEACH", "TEENS", "TEETH", "TEMPO", "TENDS", "TEXAS", "THANK", "THEFT", "THEIR",
  "THEME", "THERE", "THESE", "THICK", "THING", "THINK", "THIRD", "THOSE", "THREE", "THREW",
  "THROW", "THUMB", "TIGHT", "TIRED", "TITLE", "TODAY", "TOPIC", "TOTAL", "TOUCH", "TOUGH",
  "TOWER", "TRACK", "TRADE", "TRAIN", "TREAT", "TREND", "TRIAL", "TRIBE", "TRICK", "TRIED",
  "TRIES", "TRULY", "TRUNK", "TRUST", "TRUTH", "TWICE", "TWIST", "TYPED", "ULTRA", "UNCLE",
  "UNCUT", "UNDER", "UNFED", "UNION", "UNITY", "UNTIL", "UPPER", "UPSET", "URBAN", "USAGE",
  "USED", "USER", "USING", "USUAL", "VALUE", "VIDEO", "VIRUS", "VISIT", "VITAL", "VOCAL",
  "VOICE", "WASTE", "WATCH", "WATER", "WAVED", "WEARS", "WEIGH", "WEIRD", "WELCOME", "WHATEVER",
  "WHEEL", "WHERE", "WHICH", "WHILE", "WHITE", "WHOLE", "WHOSE", "WIDEN", "WIDER", "WILLINGNESS",
  "WOMAN", "WOMEN", "WORLD", "WORRY", "WORSE", "WORST", "WORTH", "WOULD", "WRITE", "WRONG",
  "WROTE", "YIELD", "YOUNG", "YOURS", "YOUTH"
];

    const answer = answers[Math.floor(Math.random() * answers.length)];
    const maxGuesses = 6;
    const wordLength = 5;
    const game = document.getElementById("game");
    let currentGuess = 0;
    let currentLetter = 0;
    let gameOver = false;
    let currentWord = "";
    let keyboardState = {}; // Track letter states for keyboard coloring
    let guessResults = []; // Store results for sharing

    function initGrid() {
      for (let i = 0; i < maxGuesses; i++) {
        const row = document.createElement("div");
        row.className = "guess-row";
        row.id = `row-${i}`;
        for (let j = 0; j < wordLength; j++) {
          const box = document.createElement("div");
          box.className = "letter-box";
          row.appendChild(box);
        }
        game.appendChild(row);
      }
    }

    function addLetter(letter) {
      if (gameOver || currentLetter >= wordLength) return;
      
      const row = document.getElementById(`row-${currentGuess}`);
      const box = row.children[currentLetter];
      box.textContent = letter;
      box.classList.add('current-letter');
      
      currentWord += letter;
      currentLetter++;
    }

    function removeLetter() {
      if (gameOver || currentLetter <= 0) return;
      
      currentLetter--;
      currentWord = currentWord.slice(0, -1);
      
      const row = document.getElementById(`row-${currentGuess}`);
      const box = row.children[currentLetter];
      box.textContent = "";
      box.classList.remove('current-letter');
    }

    function updateKeyboardKey(letter, state) {
      if (!keyboardState[letter] || 
          (keyboardState[letter] === 'absent' && state !== 'absent') ||
          (keyboardState[letter] === 'present' && state === 'correct')) {
        keyboardState[letter] = state;
        
        const key = document.querySelector(`[data-key="${letter}"]`);
        if (key) {
          key.classList.remove('correct', 'present', 'absent');
          key.classList.add(state);
        }
      }
    }

    function submitGuess() {
      if (gameOver || currentWord.length !== wordLength) return;

      const guess = currentWord;
      const row = document.getElementById(`row-${currentGuess}`);
      
      // Create array to track which letters have been used for correct/present marking
      const answerArray = answer.split('');
      const guessArray = guess.split('');
      const letterStates = new Array(wordLength).fill('absent');
      
      // First pass: mark correct letters
      for (let i = 0; i < wordLength; i++) {
        if (guessArray[i] === answerArray[i]) {
          letterStates[i] = 'correct';
          answerArray[i] = null; // Mark as used
        }
      }
      
      // Second pass: mark present letters
      for (let i = 0; i < wordLength; i++) {
        if (letterStates[i] === 'absent') {
          const letterIndex = answerArray.indexOf(guessArray[i]);
          if (letterIndex !== -1) {
            letterStates[i] = 'present';
            answerArray[letterIndex] = null; // Mark as used
          }
        }
      }
      
      // Apply the styling and update keyboard
      const rowResult = [];
      for (let i = 0; i < wordLength; i++) {
        const box = row.children[i];
        box.classList.remove('current-letter');
        box.classList.add(letterStates[i]);
        updateKeyboardKey(guessArray[i], letterStates[i]);
        rowResult.push(letterStates[i]);
      }
      
      guessResults.push(rowResult);

      if (guess === answer) {
        gameOver = true;
        document.getElementById('share-button').style.display = 'inline-block';
        setTimeout(() => alert("🎉 Congratulations! You got it! 🐢"), 500);
      } else if (++currentGuess === maxGuesses) {
        gameOver = true;
        document.getElementById('share-button').style.display = 'inline-block';
        setTimeout(() => alert("Game over! The answer was: " + answer), 500);
      }

      currentWord = "";
      currentLetter = 0;
    }

    function shareResults() {
      const gameNumber = Math.floor(Math.random() * 1000) + 1;
      const attempts = gameOver && currentWord === "" ? (currentGuess === maxGuesses ? "X" : currentGuess) : currentGuess;
      
      let resultText = `Turdle 🐢 #${gameNumber} ${attempts}/${maxGuesses}\n\n`;
      
      guessResults.forEach(row => {
        row.forEach(state => {
          if (state === 'correct') resultText += '🟩';
          else if (state === 'present') resultText += '🟨';
          else resultText += '⬛';
        });
        resultText += '\n';
      });
      
      resultText += '\nPlay at: ' + window.location.href;
      
      if (navigator.share) {
        navigator.share({
          title: 'Turdle 🐢',
          text: resultText
        });
      } else {
        navigator.clipboard.writeText(resultText).then(() => {
          alert('Results copied to clipboard!');
        }).catch(() => {
          // Fallback for older browsers
          const textArea = document.createElement('textarea');
          textArea.value = resultText;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          alert('Results copied to clipboard!');
        });
      }
    }

    initGrid();

    // Keyboard event listeners
    document.addEventListener('keydown', (e) => {
      if (gameOver) return;
      
      const key = e.key.toUpperCase();
      
      if (key === 'ENTER') {
        submitGuess();
      } else if (key === 'BACKSPACE') {
        removeLetter();
      } else if (/^[A-Z]$/.test(key)) {
        addLetter(key);
      }
    });

    // On-screen keyboard clicks
    document.querySelectorAll('.key').forEach(key => {
      key.addEventListener('click', () => {
        if (gameOver) return;
        
        const keyValue = key.getAttribute('data-key');
        
        if (keyValue === 'ENTER') {
          submitGuess();
        } else if (keyValue === 'BACKSPACE') {
          removeLetter();
        } else if (/^[A-Z]$/.test(keyValue)) {
          addLetter(keyValue);
        }
      });
    });
  </script>
</body>
</html>
